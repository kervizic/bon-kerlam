# nginx.conf — bon.kerlam.fr (front statique)
#
# Règle de cache à trois niveaux :
#  1. HTML (le shell lui-même) + sw.js + app-version.js + manifest.webmanifest
#     + version.json : JAMAIS de cache navigateur (no-cache, must-revalidate).
#     Ce sont les fichiers qui portent le mécanisme de mise à jour forcée
#     (cf. assets/app-version.js) — ils doivent toujours être revérifiés.
#  2. Tout le reste sous /assets/ (styles.css, app.js, supabase-client.js,
#     vendor/..., icônes) : cache long et immuable. Sûr car ces fichiers sont
#     appelés avec un suffixe `?v=N` qui change à chaque déploiement -> une
#     nouvelle URL, donc une nouvelle entrée de cache, jamais de collision.
#  3. Tout le reste (fallback SPA) : pas de cache, retombe sur index.html.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; manifest-src 'self'; connect-src 'self' https://*.kerlam.fr https://api-adresse.data.gouv.fr; base-uri 'self'; form-action 'self'" always;

  # ------------------------------------------------- Jamais de cache (tier 1) --
  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /assets/app-version.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }
  location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # Config runtime (chargée sans ?v=) : jamais en cache immuable.
  location = /assets/config.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # --------------------------------------- Assets versionnés ?v=... (tier 2) --
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ----------------------------------------------- HTML / fallback SPA (tier 3) --
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  server_tokens off;
}
