<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KERLAM">
  <!-- Maskable: safe zone is the inner 80% (icon content must fit within a centered circle
       of ~410px diameter) so OS masks (circle, squircle, rounded-square) never clip the logo. -->
  <rect width="512" height="512" fill="#2B2B2B"/>
  <text x="256" y="292" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900"
        font-size="104" text-anchor="middle" letter-spacing="-2">
    <tspan fill="#E8E8E6">KER</tspan><tspan fill="#FF9300">LAM</tspan>
  </text>
</svg>
