name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kervizic/bon-kerlam

jobs:
  tests:
    name: Tests (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances système WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libffi-dev shared-mime-info fonts-dejavu-core
      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        run: pytest -q

  build-and-push:
    name: Build & push image GHCR
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Déduire la version depuis le tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Vérifier la cohérence avec le fichier VERSION
        run: |
          FILE_VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [ "$FILE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Incohérence: VERSION=$FILE_VERSION, tag=${{ steps.ver.outputs.version }}" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build de l'image (chargée localement pour les tests)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            GIT_SHA=${{ github.sha }}

      - name: Test fumée — PDF WeasyPrint dans l'image
        run: |
          docker run --rm --entrypoint python \
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }} \
            -c "from weasyprint import HTML; HTML(string='<b>bon.kerlam.fr</b>').write_pdf(); print('PDF OK dans l image')"

      - name: Test fumée — health + version
        run: |
          docker run -d --name bon_smoke -e APP_ENV=production -p 8000:8000 \
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          V=$(curl -fsS http://127.0.0.1:8000/api/version)
          echo "$V"
          echo "$V" | grep -q "${{ steps.ver.outputs.version }}" || { echo "version mismatch"; exit 1; }
          docker rm -f bon_smoke

      - name: Push des tags (version + beta)
        run: |
          docker tag ${{ env.IMAGE }}:${{ steps.ver.outputs.version }} ${{ env.IMAGE }}:beta
          docker push ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          docker push ${{ env.IMAGE }}:beta
