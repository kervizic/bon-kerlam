name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build + push ghcr (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [worker, front]
    steps:
      - uses: actions/checkout@v4

      - name: Version depuis le tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: true
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/kervizic/bon-kerlam-${{ matrix.component }}:${{ steps.v.outputs.version }}
            ghcr.io/kervizic/bon-kerlam-${{ matrix.component }}:beta
          labels: |
            org.opencontainers.image.source=https://github.com/kervizic/bon-kerlam
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
