# docker-compose de l'application bon.kerlam.fr (lettres de voiture KERLAM)
#
# IMPORTANT - bind sur 127.0.0.1 uniquement :
# Sur le VPS, Docker insere ses propres regles iptables qui CONTOURNENT ufw.
# Un bind sur "8095:8000" exposerait donc le port directement sur l'IP publique,
# meme si ufw bloque le 8095. On bind donc explicitement sur l'interface loopback
# (127.0.0.1) pour que seul nginx (sur la meme machine) puisse joindre le conteneur.
# Le TLS et le reverse proxy sont assures par nginx (cf. nginx/bon.kerlam.fr.conf).

services:
  bon:
    image: ghcr.io/kervizic/bon-kerlam:${BON_VERSION}
    container_name: bon
    restart: unless-stopped
    # Loopback seulement - voir le commentaire en tete de fichier.
    ports:
      - "127.0.0.1:8095:8000"
    mem_limit: 256m
    env_file: .env
    volumes:
      # Base SQLite (WAL) et donnees persistantes.
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
