name: bon-kerlam

# Pile Supabase ALLÉGÉE (Postgres + GoTrue + PostgREST + Storage) + worker.
# Pas de Kong, Studio ni Realtime. Tous les ports publiés sur 127.0.0.1 UNIQUEMENT
# (Docker contourne ufw sur ce VPS). Réglée pour la mémoire minimale.

services:
  db:
    container_name: bon-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/zz-fix.sql:/docker-entrypoint-initdb.d/init-scripts/zz-fix.sql:Z
      - db-data:/var/lib/postgresql/data:Z
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=48MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=30
      - -c
      - effective_cache_size=128MB
      - -c
      - log_min_messages=fatal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    container_name: bon-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9999:9999"
    mem_limit: 64m
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      # Connexion : Google OU code OTP e-mail (6 chiffres, sans mot de passe).
      # L'inscription « libre » est bloquée par la liste blanche (RLS + hook) :
      # un e-mail non listé peut obtenir un code mais ne voit RIEN.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Session persistante sur le téléphone (refresh token tournant).
      GOTRUE_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      # SMTP (réutilise la connexion Documenso ; valeurs posées sur le serveur).
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-bon@kerlam.fr}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-KERLAM}
      # Sujets FR de TOUS les mails transactionnels (sinon GoTrue applique ses
      # sujets anglais par défaut). « confirmation » = 1er code d'un nouvel
      # utilisateur ; on le traite comme le magic link (même code à 6 chiffres).
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Votre code de connexion KERLAM"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Votre code de connexion KERLAM"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Réinitialisation de votre accès KERLAM"
      GOTRUE_MAILER_SUBJECTS_INVITE: "Invitation à l'application KERLAM"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirmation du changement d'e-mail KERLAM"
      # Modèles FR montés sur le serveur (vide = modèle anglais intégré, à éviter).
      # confirmation -> même modèle « code » que magic_link (pas de lien à cliquer).
      # recovery/invite/email_change -> modèle générique FR (code + lien de secours
      # /auth/v1/verify correct grâce à API_EXTERNAL_URL).
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${GOTRUE_MAILER_TEMPLATES_MAGIC_LINK}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${GOTRUE_MAILER_TEMPLATES_CONFIRMATION}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${GOTRUE_MAILER_TEMPLATES_RECOVERY}
      GOTRUE_MAILER_TEMPLATES_INVITE: ${GOTRUE_MAILER_TEMPLATES_INVITE}
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: ${GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE}
      # Hook « before user created » (refus des e-mails non listés) si disponible.
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: ${GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED:-false}
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: ${GOTRUE_HOOK_BEFORE_USER_CREATED_URI}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      # API_EXTERNAL_URL inclut déjà /auth/v1 : ne PAS le re-concaténer ici.
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      # Google uniquement.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback
      # Restriction de domaine (hd) optionnelle, désactivée par défaut.
      GOTRUE_EXTERNAL_GOOGLE_HD: ${GOOGLE_HD}
    volumes:
      - ./email/otp_fr.html:/etc/gotrue/otp_fr.html:ro
      - ./email/action_fr.html:/etc/gotrue/action_fr.html:ro

  rest:
    container_name: bon-rest
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 64m
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    container_name: bon-storage
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 192m
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      # Backend S3 OVH (aucun stockage local).
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${S3_BUCKET}
      REGION: ${S3_REGION}
      GLOBAL_S3_ENDPOINT: ${S3_ENDPOINT}
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      TENANT_ID: kerlam
      ENABLE_IMAGE_TRANSFORMATION: "false"

  worker:
    container_name: bon-worker
    image: ghcr.io/kervizic/bon-kerlam-worker:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8099"
    mem_limit: 128m
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      WORKER_DATABASE_URL: postgres://bon_worker:${WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      GEOCODE_ON_START: ${GEOCODE_ON_START:-false}
      KERLAM_SIREN: ${KERLAM_SIREN}
      STORAGE_URL: http://storage:5000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      DOCS_BUCKET: chauffeur-docs

  front:
    container_name: bon-front
    image: ghcr.io/kervizic/bon-kerlam-front:${APP_VERSION:-dev}
    build:
      context: ..
      dockerfile: front/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    mem_limit: 48m

volumes:
  db-data:
