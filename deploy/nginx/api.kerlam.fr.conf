# api.kerlam.fr — frontal de la pile Supabase allégée (compatible nginx 1.14 / certbot 0.31).
# Proxifie /auth/v1 -> GoTrue, /rest/v1 -> PostgREST, /storage/v1 -> Storage.
# Les services écoutent sur 127.0.0.1 uniquement.

map $http_origin $bon_cors {
    default "";
    "~^https://(bon\.kerlam\.fr)$" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.kerlam.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.kerlam.fr;

    ssl_certificate     /etc/letsencrypt/live/api.kerlam.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kerlam.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 50m;

    # CORS géré par nginx (on masque celui des services amont).
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin  $bon_cors always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Profile, Content-Location, Range-Unit" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/v1/    { proxy_pass http://127.0.0.1:9999/; }
    location /rest/v1/    { proxy_pass http://127.0.0.1:3000/; }
    location /storage/v1/ { proxy_pass http://127.0.0.1:5000/; }

    # Modèles d'e-mail FR servis en statique : GoTrue récupère ses templates par
    # HTTP (le schéma file:// n'est PAS supporté), via https://api.kerlam.fr/email/.
    # Ce sont de simples fichiers HTML avec des variables {{ .Token }} — aucun secret.
    location ^~ /email/ {
        alias /opt/bon-kerlam/deploy/email/;
        default_type text/html;
        autoindex off;
    }

    # Filet de sécurité : les liens GoTrue émis AVANT le correctif (API_EXTERNAL_URL
    # sans /auth/v1) pointent vers /verify, /callback, etc. sans préfixe. On les
    # rebascule vers /auth/v1/... en conservant la query string ($request_uri
    # commence par le chemin d'origine + « ? ... »).
    location /verify    { return 301 https://$host/auth/v1$request_uri; }
    location /callback  { return 301 https://$host/auth/v1$request_uri; }
    location /authorize { return 301 https://$host/auth/v1$request_uri; }
    location /token     { return 301 https://$host/auth/v1$request_uri; }

    # Racine de l'API : rediriger vers l'app (un lien de mail égaré ne doit jamais
    # tomber sur un 404 nu). Les chemins /auth/v1, /rest/v1, /storage/v1 restent proxifiés.
    location = / { return 302 https://bon.kerlam.fr/; }
    location / { return 404; }

    access_log /var/log/nginx/api.kerlam.access.log;
    error_log  /var/log/nginx/api.kerlam.error.log;
}
