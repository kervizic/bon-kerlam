# bon.kerlam.fr — front statique (PWA) + proxy /worker/ vers bon-worker.
# Compatible nginx 1.14 / certbot 0.31. Règles de cache pour la mise à jour
# automatique des clients (cf. front/assets/app-version.js).
#
# Deux options pour servir le front :
#   A) fichiers statiques déposés dans /opt/bon-kerlam/front (root ci-dessous) ;
#   B) proxy vers le conteneur bon-front (127.0.0.1:8088).
# Ici : option A (la plus légère). Pour B, remplacer `root`/try_files par proxy_pass.

server {
    listen 80;
    listen [::]:80;
    server_name bon.kerlam.fr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bon.kerlam.fr;

    ssl_certificate     /etc/letsencrypt/live/bon.kerlam.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bon.kerlam.fr/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/bon-kerlam/front;
    index index.html;

    # Worker (PDF, jetons IA, tâches serveur).
    location /worker/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8099/worker/;
    }

    # Assets versionnés (?v=...) : cache long immuable.
    location ~* ^/assets/.*\.(css|js|svg|woff2?|ttf|eot|ico|png|jpg|jpeg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Shell d'app, service worker, mise à jour, manifeste : jamais mis en cache.
    location = /app-version.js { add_header Cache-Control "no-cache, must-revalidate" always; try_files $uri =404; }
    location = /assets/app-version.js { add_header Cache-Control "no-cache, must-revalidate" always; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate" always; try_files $uri =404; }
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate" always; }

    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/bon.kerlam.access.log;
    error_log  /var/log/nginx/bon.kerlam.error.log;
}
