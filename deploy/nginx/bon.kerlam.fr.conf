# vhost nginx pour bon.kerlam.fr (lettres de voiture KERLAM).
# Compatible nginx 1.14 (pas de directive recente).
# L'application est servie par le conteneur Docker bind sur 127.0.0.1:8095
# (cf. deploy/docker-compose.yml). nginx assure le TLS et le reverse proxy.

# ---------------------------------------------------------------------------
# Bloc HTTP : redirection vers HTTPS, sauf le challenge ACME (Let's Encrypt).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bon.kerlam.fr;

    # Laisser passer le renouvellement des certificats Let's Encrypt (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste bascule en HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Bloc HTTPS : TLS + reverse proxy vers le backend FastAPI.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bon.kerlam.fr;

    # --- Certificats Let's Encrypt ---
    ssl_certificate     /etc/letsencrypt/live/bon.kerlam.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bon.kerlam.fr/privkey.pem;

    # --- Parametres TLS raisonnables (compatibles nginx 1.14) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- En-tetes de securite ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP : 'self' par defaut ; autorise l'API adresse data.gouv.fr en connect-src
    # et data: pour les tuiles / images inline de carte.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api-adresse.data.gouv.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # Taille max des corps de requete (uploads eventuels).
    client_max_body_size 10m;

    # --- En-tetes proxy communs (factorises via un fichier include implicite) ---
    # nginx 1.14 ne supporte pas les "snippets" sans include ; on repete donc
    # les proxy_set_header dans chaque bloc location ci-dessous.

    # =======================================================================
    # POLITIQUE DE CACHE
    # Esprit repris de kertec : les fichiers "pivots" (coquille HTML, service
    # worker, manifest, pointeur de version) ne doivent JAMAIS etre mis en
    # cache long, sinon le client reste bloque sur une ancienne version. Les
    # assets versionnes par ?v= sont immuables et caches 1 an.
    #
    # Comme l'app est servie par le proxy (pas par un root nginx), on applique
    # le Cache-Control en masquant celui du backend (proxy_hide_header) puis en
    # ajoutant le notre (add_header).
    # =======================================================================

    # --- Fichiers pivots : jamais de cache long ---
    # Racine (coquille index.html), service worker, pointeur de version, manifest.
    location = / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Re-affirmer les en-tetes de securite (add_header est non herite des que
        # le location en definit un).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /assets/app-version.js {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- Autres assets versionnes (?v=...) : immuables, cache 1 an ---
    # Ce bloc ne doit PAS attraper /assets/app-version.js (deja gere ci-dessus
    # par un match exact "=" qui est prioritaire sur ce prefixe).
    location /assets/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Cache-Control;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # --- Reste de l'application (API, pages) : passe-plat vers le backend ---
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Re-affirmer les en-tetes de securite dans ce location.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api-adresse.data.gouv.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
