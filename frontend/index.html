<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF9300">
  <meta name="app-version" content="__APP_VERSION__">
  <meta name="description" content="KERLAM — Lettres de voiture dematerialisees">
  <title>KERLAM — Lettres de voiture</title>
  <link rel="manifest" href="/manifest.webmanifest?v=__APP_VERSION__">
  <link rel="icon" href="/assets/icons/icon-192.png?v=__APP_VERSION__">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png?v=__APP_VERSION__">
  <link rel="stylesheet" href="/assets/styles.css?v=__APP_VERSION__">
  <script defer src="/assets/app-version.js?v=__APP_VERSION__"></script>
</head>
<body>
  <!-- Barre haute : logo, undo/redo, indicateur d'enregistrement -->
  <header class="topbar" role="banner">
    <div class="topbar__brand">
      <span class="logo" aria-label="KERLAM"><span class="logo__ker">KER</span><span class="logo__lam">LAM</span></span>
    </div>
    <div class="topbar__actions">
      <button type="button" class="iconbtn" id="btn-undo" title="Annuler" aria-label="Annuler" disabled>&#x21B6;</button>
      <button type="button" class="iconbtn" id="btn-redo" title="Retablir" aria-label="Retablir" disabled>&#x21B7;</button>
      <span class="saveind" id="save-indicator" role="status" aria-live="polite">
        <span class="saveind__dot" aria-hidden="true"></span>
        <span class="saveind__label" id="save-label">Enregistre</span>
      </span>
    </div>
  </header>

  <div class="layout">
    <!-- Menu lateral bureau -->
    <nav class="sidenav" aria-label="Navigation principale">
      <ul class="sidenav__list">
        <li><a href="#/aujourdhui" data-nav>Tableau de bord</a></li>
        <li><a href="#/lv" data-nav>LV</a></li>
        <li><a href="#/planning" data-nav>Planning</a></li>
        <li><a href="#/projets" data-nav>Projets</a></li>
        <li><a href="#/clients" data-nav>Clients</a></li>
        <li><a href="#/sites" data-nav>Sites</a></li>
        <li><a href="#/camions" data-nav>Camions</a></li>
        <li><a href="#/chauffeurs" data-nav>Chauffeurs</a></li>
        <li><a href="#/articles" data-nav>Articles</a></li>
        <li><a href="#/reglages" data-nav>Reglages</a></li>
      </ul>
    </nav>

    <!-- Zone de contenu rendue par le routeur -->
    <main class="content" id="view" role="main" tabindex="-1">
      <p class="loading">Chargement&hellip;</p>
    </main>
  </div>

  <!-- Action principale (smartphone) -->
  <div class="primary-action" id="primary-action-slot"></div>

  <!-- Barre du bas smartphone -->
  <nav class="tabbar" aria-label="Navigation rapide">
    <a href="#/aujourdhui" data-nav class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">&#x2600;</span>
      <span class="tabbar__txt">Aujourd'hui</span>
    </a>
    <a href="#/lv" data-nav class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">&#x1F4C4;</span>
      <span class="tabbar__txt">Mes LV</span>
    </a>
    <a href="#/controle" data-nav class="tabbar__item">
      <span class="tabbar__icon" aria-hidden="true">&#x2713;</span>
      <span class="tabbar__txt">Controle</span>
    </a>
  </nav>

  <footer class="appfoot" role="contentinfo">
    <span class="appfoot__ver">version <span id="app-version-txt">&hellip;</span></span>
  </footer>

  <script type="module" src="/assets/app.js?v=__APP_VERSION__"></script>
</body>
</html>
