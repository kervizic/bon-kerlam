[project]
name = "bon-kerlam"
version = "0.1.0b1"
description = "Lettres de voiture dématérialisées KERLAM — worker + MCP (Supabase allégé)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["front/assets/vendor", "**/migrations/*.sql"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI Depends() en valeur par défaut

[tool.pytest.ini_options]
testpaths = ["worker/tests", "supabase/tests"]
addopts = "-ra -q"
markers = [
  "db: test nécessitant une base Postgres (service CI).",
]
